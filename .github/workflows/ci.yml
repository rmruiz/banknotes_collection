# CI mínima (T1): ruff → mypy → pytest + node --test.
# Sin ImageMagick en el runner: los tests que lo requieran deben
# `skipif` (T3) y `build()` se prueba contra fixtures en tmp_path.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # el código debe seguir siendo 3.9-compatible

      - name: Instalar toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: python -m pytest

  js:
    name: "JS (node --test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Runner nativo de Node, cero dependencias (decisión T1: KISS).
      # Los tests viven en web/tests/*.test.js (desde T6). Se pasa el
      # DIRECTORIO (no un glob entre comillas): descubrimiento nativo de
      # --test desde Node 18, sin depender de la expansión del shell.
      # Node >= 22.7 detecta sintaxis ESM en .js por defecto (package.json
      # está gitignoreado, no hay "type":"module" en el runner).

      - name: node --test
        run: node --test web/tests
