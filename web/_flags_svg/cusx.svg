<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">

  <!-- CURAZAO (900x600) -->
  <rect x="0" y="0" width="900" height="600" fill="#002B7F"/>

  <!-- Franja amarilla -->
  <rect x="0" y="450" width="900" height="50" fill="#FCD116"/>

  <!-- Estrella grande -->
  <g transform="translate(130,160)">
    <polygon points="0,-56 12,-18 52,-18 20,6 32,44 0,22 -32,44 -20,6 -52,-18 -12,-18"
             fill="white"/>
  </g>

  <!-- Estrella pequeña -->
  <g transform="translate(85,100) scale(0.55)">
    <polygon points="0,-56 12,-18 52,-18 20,6 32,44 0,22 -32,44 -20,6 -52,-18 -12,-18"
             fill="white"/>
  </g>

  <!-- SAN MARTIN (900x600) -->
  <g transform="translate(0,600)">

    <rect x="0" y="0" width="900" height="600" fill="#FFFFFF"/>

    <!-- Campo rojo -->
    <polygon points="225,0 900,0 900,300" fill="#CE1126"/>

    <!-- Campo azul -->
    <polygon points="225,600 900,600 900,300" fill="#002B7F"/>

    <!-- Triángulo blanco -->
    <polygon points="0,0 225,300 0,600" fill="#FFFFFF"/>

    <!-- Escudo simplificado -->
    <g transform="translate(95,300)">
      <path d="M-40,-80 L40,-80 L40,-20
               C40,45 0,80 0,80
               C0,80 -40,45 -40,-20 Z"
            fill="#FCD116"
            stroke="#000"
            stroke-width="3"/>

      <rect x="-32" y="-72" width="64" height="28" fill="#CE1126"/>
      <rect x="-32" y="-44" width="64" height="48" fill="#002B7F"/>
      <rect x="-10" y="-20" width="20" height="36" fill="#FFFFFF"/>

      <circle cx="0" cy="-115" r="16" fill="#FCD116"/>
    </g>

  </g>

</svg>
