<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colección de billetes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💵</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Máscara superior para ocultar las filas en el hueco del scroll, bajo el buscador sticky -->
  <div class="scroll-mask"></div>

  <main class="container-fluid">
    <header id="top" class="top-bar">
      <h1 class="page-title"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>Colección de billetes</h1>
      <a class="icon-btn" href="https://github.com/rmruiz/banknotes_collection" target="_blank" rel="noopener" title="Ver el repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
    </header>

    <div class="container-base search-container">
      <input type="search" id="q" class="search-input" placeholder="Buscar en todos los campos… (país, pick, moneda, año, firmas…)"
             autocomplete="off" autofocus>
      <div class="search-icons">
        <a href="stats.html" title="Ir a Estadísticas y Dashboard" class="mode-toggle icon-btn"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-4"/></svg></a>
        <a href="index-edit.html" title="Ir a modo edición" class="mode-toggle icon-btn"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></a>
        <button id="lang-toggle" class="icon-btn" title="Switch to English"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></button>
      </div>
    </div>

    <div class="container-base table-container">
      <div class="table-wrap">
        <table id="tbl">
          <thead>
            <tr>
              <th data-sort="pick"><svg class="th-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg><span class="th-label">Pick</span></th>
              <th data-col="id" data-sort="id">ID</th>
              <th data-col="pais" data-sort="pais"><svg class="th-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg><span class="th-label">País</span></th>
              <th data-col="monto" data-sort="valor" class="num"><svg class="th-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line></svg><span class="th-label">Monto</span></th>
              <th data-col="moneda" data-sort="moneda"><svg class="th-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg><span class="th-label">Moneda</span></th>
              <th data-col="currency_code" data-sort="currency_code"><svg class="th-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg><span class="th-label">ISO 4217</span></th>
              <th data-col="denominacion" data-sort="denominacion">Moneda Full</th>
              <th data-col="subtipo" data-sort="subtipo">Subtipo</th>
              <th data-col="alternativas" data-sort="alternativas">Otra moneda</th>
              <th data-col="anio" data-sort="anio" class="num"><svg class="th-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><span class="th-label">Año</span></th>
              <th data-col="firmas" data-sort="firmas">Firmas</th>
              <th data-col="temas" data-sort="temas">Temas</th>
              <th data-col="vigencia" data-sort="vigencia">Vigencia</th>
              <th data-col="obs" data-sort="obs">Observaciones</th>
              <th data-col="serie" data-sort="serie">Serie</th>
              <th data-col="banco" data-sort="banco">Banco</th>
              <th data-col="zona" data-sort="zona">Zona</th>
              <th data-col="serial" data-sort="serial">N° de serie</th>
              <th data-col="condicion" data-sort="condicion">Condición</th>
              <th data-col="grupo" data-sort="grupo">Grupo Colnect</th>
              <th data-col="conmemorativo">Conmemorativo</th>
              <th data-col="remarcado">Remarcado</th>
              <th data-col="subunidad">Subunidad</th>
              <th data-col="front"><svg class="th-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg><span class="th-label">Front</span></th>
              <th data-col="back"><svg class="th-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg><span class="th-label">Back</span></th>
              <th data-col="full" class="checkbox-cell">Full</th>
              <th data-col="colnect" class="checkbox-cell"><svg class="th-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg><span class="th-label">Colnect</span></th>
              <th data-col="numista" data-sort="numista" class="checkbox-cell"><svg class="th-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg><span class="th-label">Numista</span></th>
              <th data-col="verif" class="checkbox-cell">Verificado</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="table-footer">
        <div class="footer-left">
          <span id="count"></span>
          <details class="dropdown" id="cols-dd">
            <summary>Columnas</summary>
            <ul id="cols-menu"></ul>
          </details>
          <button id="new-note"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M12 5v14M5 12h14"/></svg>Nuevo</button>
          <button id="rebuild" title="Re-escanea las fotos del disco y regenera los datos de la tabla"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>Recargar datos</button>
        </div>

        <div class="footer-center">
          <nav id="pager" aria-label="Paginación"></nav>
        </div>

        <div class="footer-right">
          <label id="imgsize-label">Fotos
            <div class="select-wrapper">
              <select id="imgsize">
                <option value="1" selected>1x</option>
                <option value="2">2x</option>
                <option value="3">3x</option>
              </select>
              <span class="select-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
            </div>
          </label>
          <label id="perpage-label">Por página
            <div class="select-wrapper">
              <select id="perpage">
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
              <span class="select-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
            </div>
          </label>
        </div>
      </div>
    </div>
  </main>

  <dialog id="modal">
    <article>
      <header>
        <span id="modal-title"></span>
        <button id="modal-close" aria-label="Cerrar">✕</button>
      </header>
      <div id="modal-body"><img id="modal-img" alt=""></div>
    </article>
  </dialog>

  <dialog id="new-dialog">
    <article>
      <header>
        <span id="new-title">Nuevo billete</span>
        <button id="new-close" aria-label="Cerrar">✕</button>
      </header>
      <form id="new-form">
        <label id="new-pais-label">País
          <input id="new-pais" list="paises-list" required autocomplete="off"
                 placeholder="Chile, Perú, Estados Unidos…">
        </label>
        <datalist id="paises-list"></datalist>
        <label id="new-pick-label">Pick number
          <input id="new-pick" required autocomplete="off" placeholder="P-123a">
        </label>
        <button type="submit" id="new-submit">Crear</button>
      </form>
    </article>
  </dialog>

  <dialog id="detail">
    <article>
      <header>
        <span id="detail-title"></span>
        <img id="detail-flag" alt="" hidden>
        <button id="detail-close" aria-label="Cerrar">✕</button>
      </header>
      <div id="detail-wrap">
        <button id="detail-prev" class="arrow" aria-label="Anterior">‹</button>
        <div id="detail-main">
          <dl id="detail-body"></dl>
          <div id="detail-imgs"></div>
        </div>
        <button id="detail-next" class="arrow" aria-label="Siguiente">›</button>
      </div>
    </article>
  </dialog>

  <dialog id="mobile-detail">
    <article>
      <header>
        <span id="mobile-detail-title"></span>
        <img id="mobile-detail-flag" alt="" hidden>
        <button id="mobile-detail-close" aria-label="Cerrar">✕</button>
      </header>
      <div id="mobile-detail-wrap">
        <button id="mobile-detail-prev" class="arrow" aria-label="Anterior">‹</button>
        <div id="mobile-detail-main">
          <dl id="mobile-detail-body"></dl>
          <div id="mobile-detail-imgs"></div>
        </div>
        <button id="mobile-detail-next" class="arrow" aria-label="Siguiente">›</button>
      </div>
    </article>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
