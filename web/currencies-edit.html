<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monedas actuales (Edición)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💵</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="ds-dense">
  <!-- Máscara superior para ocultar las filas en el hueco del scroll, bajo el buscador sticky -->
  <div class="scroll-mask"></div>

  <main class="container-fluid">
    <header id="top" class="top-bar">
      <h1 class="page-title"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg><span id="page-title-text">Monedas actuales (Edición)</span></h1>
      <div class="top-actions">
        <button id="lang-toggle" class="icon-btn" type="button" title="Cambiar de idioma" aria-label="Cambiar de idioma"></button>
        <a class="icon-btn" href="https://github.com/rmruiz/banknotes_collection" target="_blank" rel="noopener" title="Ver el repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
      </div>
    </header>

    <div class="container-base search-container">
      <input type="search" id="q" class="search-input" placeholder="Buscar en todos los campos… (código, nombre, símbolo, banco…)"
             autocomplete="off" autofocus>
    </div>

    <div class="container-base table-container">
      <div class="table-wrap">
        <table id="tbl">
          <thead><!-- el JS (lib/datasets.js) pinta los <th> data-sort --></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="table-footer">
        <div class="footer-left">
          <span id="count"></span>
          <span id="ds-status" class="ds-status" role="status" aria-live="polite"></span>
        </div>

        <div class="footer-center">
          <nav id="pager" aria-label="Paginación"></nav>
        </div>

        <div class="footer-right">
          <label id="perpage-label">Por página
            <div class="select-wrapper">
              <select id="perpage">
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
              <span class="select-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
            </div>
          </label>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="currencies.js"></script>
</body>
</html>
